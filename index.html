  <script>
    (function(){
      function detectLegacyIpad(){
        var ua = navigator.userAgent || '';
        var match = ua.match(/OS (\d+)[_.]/);
        var major = match ? Number(match[1]) : 0;
        return /iPad/i.test(ua) && major > 0 && major <= 12;
      }
      function legacyIpadIsLandscape(){
        if(window.orientation === 90 || window.orientation === -90) return true;
        var doc = document.documentElement || {};
        var cw = doc.clientWidth || 0;
        var ch = doc.clientHeight || 0;
        var iw = window.innerWidth || 0;
        var ih = window.innerHeight || 0;
        if(cw && ch && cw > ch) return true;
        if(iw && ih && iw > ih) return true;
        return false;
      }
      function measuredLegacyViewportHeight(){
        var doc = document.documentElement || {};
        var height = window.innerHeight || doc.clientHeight || 0;
        if(!height) height = 600;
        return Math.max(320, Math.floor(height - 2));
      }
      function updateLegacyIpadClass(){
        var isLegacy = !!window.__legacyIpad;
        var isLandscape = isLegacy && legacyIpadIsLandscape();
        var isStandalone = !!window.navigator.standalone;
        var ua = navigator.userAgent || '';
        var isIpad = /iPad/i.test(ua) || ((navigator.platform || '') === 'MacIntel' && Number(navigator.maxTouchPoints || 0) > 1);
        var isPhone = /iPhone|iPod|Android.*Mobile/i.test(ua);
        document.documentElement.classList.toggle('legacyIpad', isLegacy);
        document.documentElement.classList.toggle('legacyIpadLandscape', isLandscape);
        document.documentElement.classList.toggle('legacyIpadSafari', isLegacy && !isStandalone);
        document.documentElement.classList.toggle('legacyIpadStandalone', isLegacy && isStandalone);
        document.documentElement.classList.toggle('modernIpad', !isLegacy && isIpad);
        document.documentElement.classList.toggle('modernDesktop', !isLegacy && !isIpad && !isPhone);
        if(isLegacy){
          document.documentElement.style.setProperty('--legacy-vh', measuredLegacyViewportHeight() + 'px');
        }
      }
      window.__legacyIpad = detectLegacyIpad();
      window.__updateLegacyIpadClass = updateLegacyIpadClass;
      updateLegacyIpadClass();
      window.addEventListener('resize', updateLegacyIpadClass);
      window.addEventListener('orientationchange', function(){ setTimeout(updateLegacyIpadClass, 260); });
    })();
  </script>
  <style>
    :root{
      --safe-vh:100dvh;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --bg:#ecfeff;
      --panel:#ffffff;
      --ink:#0f172a;
      --muted:#475569;
      --line:#cbd5e1;
      --brand:#0f766e;
      --brand2:#14b8a6;
      --danger:#dc2626;
      --warn:#f59e0b;
      --ok:#16a34a;
      --chip:#fef3c7;
      --shadow:0 12px 32px rgba(15,23,42,.18);
      --radius:18px;
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --legacy-vh:100vh;
    }
    @supports not (height:100dvh){:root{--safe-vh:100vh;}}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
    body{min-height:100vh;min-height:var(--safe-vh);touch-action:manipulation;-webkit-text-size-adjust:100%;}
    button,input,select{font:inherit}
    button{cursor:pointer;border:0;border-radius:14px;min-height:48px;font-weight:800;background:#e2e8f0;color:#0f172a;padding:10px 14px;}
    button:active{transform:translateY(1px)}
    button.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
    button.danger{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
    button.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
    button.ghost{background:#f8fafc;border:1px solid var(--line)}
    button.small{min-height:40px;padding:8px 10px;font-size:16px;border-radius:12px}
    button.cancel-select-strong{background:#dc2626;color:#fff;border:2px solid #991b1b;}
    input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;color:var(--ink);font-size:18px;}
    label{font-weight:800;font-size:16px;color:#334155;display:block;margin:6px 0 4px}
    .app-shell{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;width:100vw;height:var(--safe-vh);max-height:var(--safe-vh);max-width:1366px;margin:0 auto;padding:8px max(12px,var(--safe-right)) calc(12px + var(--safe-bottom)) max(12px,var(--safe-left));display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:8px;overflow:hidden;}
    .app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 10px;position:sticky;top:0;background:linear-gradient(180deg,rgba(236,254,255,.98),rgba(236,254,255,.86));z-index:10;backdrop-filter:blur(8px)}
    .title-wrap{display:flex;align-items:baseline;gap:10px;min-width:0;}
    .app-title{font-size:clamp(23px,2.4vw,34px);font-weight:950;letter-spacing:.02em;white-space:nowrap;}
    .version{font-size:clamp(15px,1.4vw,20px);font-weight:900;color:#0f766e;white-space:nowrap;}
    .status-line{font-size:clamp(14px,1.2vw,18px);font-weight:800;color:#475569;text-align:right;}
    .selected-banner{display:none;position:fixed;left:12px;right:12px;top:max(8px,env(safe-area-inset-top,0px));align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:9px 12px;border:3px solid #facc15;background:linear-gradient(135deg,#172554,#1e3a8a);color:#fff;border-radius:16px;font-size:22px;font-weight:1000;box-shadow:0 10px 24px rgba(15,23,42,.26);z-index:48;backdrop-filter:blur(8px)}
    .selected-banner.show{display:flex}
    .selected-banner #selectedText{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;line-height:1.12;}
    .selected-banner .selected-name{color:#fde047;font-size:1.16em;font-weight:1000;}
    .selected-banner button{flex:0 0 auto;min-width:132px;min-height:48px;font-size:20px;border-radius:14px;}
    .app-header,.section-title{display:none;}
    .board-section{margin:0;min-width:0;min-height:0;}
    .section-title{display:none;}
    .zone-row{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-width:0;min-height:0;}
    .zone-row.mode-2{grid-template-columns:repeat(2,minmax(0,1fr));}
    .zone-row.next-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:3px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
    .zone-row.next-scroll .zone-card{min-width:0;}
    .zone-card{background:rgba(255,255,255,.96);border:1px solid #bae6fd;border-radius:var(--radius);box-shadow:0 10px 22px rgba(15,23,42,.1);padding:8px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
    .rest-board-card{background:rgba(248,250,252,.98);border-color:#cbd5e1;}
    .rest-board-card .zone-head{background:linear-gradient(135deg,#334155,#64748b);border-color:#cbd5e1;}
    .rest-board-grid{flex:1 1 auto;display:grid;grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(145px,1fr);gap:8px;min-height:0;overflow:hidden;}
    .rest-board-empty{grid-column:1 / -1;grid-row:1 / -1;border:2px dashed #94a3b8;border-radius:16px;background:#f8fafc;color:#94a3b8;font-weight:900;font-size:clamp(14px,1.5vw,20px);display:flex;align-items:center;justify-content:center;text-align:center;}
    .rest-board-space{border:2px dashed #94a3b8;border-radius:16px;background:#f8fafc;color:#94a3b8;font-weight:900;font-size:clamp(14px,1.5vw,20px);display:flex;align-items:center;justify-content:center;text-align:center;min-height:0;}
    html.legacyIpad .rest-board-card{display:none;}
    .zone-card.call-target{animation:courtCallPulse 1.6s ease-in-out 0s 2;border-color:var(--call-border,#facc15);box-shadow:0 0 0 var(--call-ring,4px) var(--call-soft,rgba(250,204,21,.45)),0 10px 22px rgba(15,23,42,.16);}
    .zone-card.call-target .zone-head{box-shadow:inset 0 0 0 3px rgba(255,255,255,.85);}
    .zone-card.call-yellow{--call-border:#facc15;--call-soft:rgba(250,204,21,.45);--call-strong:rgba(250,204,21,.75);}
    .zone-card.call-green{--call-border:#22c55e;--call-soft:rgba(34,197,94,.42);--call-strong:rgba(34,197,94,.72);}
    .zone-card.call-blue{--call-border:#38bdf8;--call-soft:rgba(56,189,248,.42);--call-strong:rgba(56,189,248,.72);}
    .zone-card.call-red{--call-border:#fb7185;--call-soft:rgba(251,113,133,.42);--call-strong:rgba(251,113,133,.72);}
    .zone-card.call-low{--call-ring:3px;--call-ring-strong:5px;--call-scale:.992;}
    .zone-card.call-medium{--call-ring:4px;--call-ring-strong:8px;--call-scale:.985;}
    .zone-card.call-high{--call-ring:6px;--call-ring-strong:12px;--call-scale:.975;}
    .zone-card.entry-static-pending{border-color:var(--call-border,#facc15);box-shadow:0 0 0 var(--call-ring,4px) var(--call-soft,rgba(250,204,21,.35)),0 10px 22px rgba(15,23,42,.14);}
    .zone-card.entry-dynamic-focus{position:relative;}
    .zone-card.entry-dynamic-focus::after{content:"";position:absolute;inset:2px;border-radius:calc(var(--radius) - 2px);pointer-events:none;background:linear-gradient(105deg,transparent 15%,var(--call-soft,rgba(250,204,21,.35)) 45%,transparent 75%);opacity:.65;transform:translateX(-110%);animation:entryCourtSweep 2s ease-in-out infinite;}
    .zone-card.entry-pre-pulse{animation:entryPrePulse .22s ease-out 1;border-color:var(--call-border,#facc15);}
    .slot.entry-destination-hidden .player-chip{opacity:0;}
    @keyframes courtCallPulse{
      0%,100%{transform:scale(1);box-shadow:0 0 0 var(--call-ring,4px) var(--call-soft,rgba(250,204,21,.35)),0 10px 22px rgba(15,23,42,.16);}
      45%{transform:scale(var(--call-scale,.985));box-shadow:0 0 0 var(--call-ring-strong,8px) var(--call-strong,rgba(250,204,21,.75)),0 12px 26px rgba(15,23,42,.22);}
    }
    @keyframes entryCourtSweep{0%,18%{transform:translateX(-110%);opacity:0}36%,74%{opacity:.7}100%{transform:translateX(110%);opacity:0}}
    @keyframes entryPrePulse{0%{transform:scale(1)}55%{transform:scale(.985);box-shadow:0 0 0 10px var(--call-soft,rgba(250,204,21,.35))}100%{transform:scale(1)}}
    .zone-head{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:14px;border:1px solid #99f6e4;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:14px;min-height:44px;padding:8px 10px;text-align:left;}
    .zone-head.warn{background:linear-gradient(135deg,#92400e,#f59e0b);border-color:#facc15;}
    .zone-head:active{transform:translateY(1px)}
    .zone-title{font-size:clamp(18px,2vw,25px);font-weight:950;color:#0f172a;white-space:nowrap;min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;}
    .zone-head .zone-title,.zone-head .zone-count{color:#fff;}
    .zone-count{font-size:15px;color:#64748b;font-weight:800;white-space:nowrap;flex:0 0 auto;}
    .court-down-pill{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:136px;min-height:34px;padding:4px 14px;border-radius:999px;background:#fef3c7;color:#92400e;border:2px solid rgba(146,64,14,.25);font-weight:1000;font-size:20px;line-height:1;box-shadow:inset 0 -2px 0 rgba(146,64,14,.12);flex:0 0 auto;}
    .court-down-pill .arrow{display:inline-block;animation:downArrowBounce .9s ease-in-out infinite;}
    @keyframes downArrowBounce{0%,100%{transform:translateY(-1px)}50%{transform:translateY(3px)}}
    .call-marquee{min-width:0;flex:1 1 auto;overflow:hidden;white-space:nowrap;font-size:30px;font-weight:1000;color:#fff;}
    .call-marquee span{display:inline-block;min-width:100%;animation:callMarquee 1.4s ease-in-out infinite alternate;}
    @keyframes callMarquee{0%{transform:translateX(0)}100%{transform:translateX(18px)}}
    .slot-grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;min-height:0;}
    .slot{border:2px dashed #94a3b8;border-radius:16px;background:#f8fafc;min-height:54px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
    .slot.empty::after{content:"點此放入";color:#94a3b8;font-weight:900;font-size:clamp(14px,1.5vw,20px)}
    .zone-action{display:none;}
    .player-chip{position:relative;width:100%;height:100%;min-height:54px;border-radius:15px;border:3px solid rgba(255,255,255,.95);box-shadow:0 4px 10px rgba(15,23,42,.18);display:flex;align-items:center;justify-content:center;padding:8px 8px 6px;overflow:hidden;color:#0f172a;user-select:none;cursor:pointer;}
    .player-chip.selected{transform:scale(.96);border-color:#111827;box-shadow:inset 0 0 0 3px #fff,0 4px 12px rgba(15,23,42,.25);}
    .player-chip.selected::after{content:"✓";position:absolute;top:4px;right:6px;z-index:3;width:24px;height:24px;border-radius:999px;background:#111827;color:#fff;font-size:16px;font-weight:1000;line-height:24px;text-align:center;}
    .player-chip .games{position:absolute;top:4px;left:6px;z-index:1;background:rgba(255,255,255,.95);border:1px solid rgba(15,23,42,.18);border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,1.8vw,22px);font-weight:1000;line-height:1;padding:0 6px;}
    .player-chip .name{position:relative;z-index:2;text-align:center;font-weight:1000;line-height:1.05;letter-spacing:.02em;font-size:clamp(20px,2.6vw,34px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;}
    .entry-animation-overlay{position:fixed;inset:0;z-index:47;pointer-events:none;overflow:hidden;}
    .entry-fly-clone{position:fixed;margin:0;pointer-events:none;will-change:transform,opacity;transform-origin:center center;transition:transform .42s cubic-bezier(.2,.82,.2,1),opacity .42s ease;box-shadow:0 16px 32px rgba(15,23,42,.28);}
    .entry-fly-clone.lift{transform:translateY(-6px) scale(1.02);}
    .entry-fly-clone.arrive{opacity:.96;}
    .entry-fly-clone.settle{transition:transform .22s cubic-bezier(.34,1.56,.64,1),opacity .18s ease;transform:scale(.98);}

    .floating-button.speaker-button.show{display:flex;}

      }, duration * 1000);
      return;
    }
    const now = Date.now();
    const duration = Number(state.settings.callEffectDuration) || 5;
    const nextExpiry = now + duration * 1000;
    const previous = courtHighlightZone;
    if(previous && previous !== zone && courtHighlightExpiry[previous] && courtHighlightExpiry[previous] > now){
      setStaticCourtHighlight(previous, courtHighlightExpiry[previous]);
    }
    courtHighlightZone = zone || null;
    if(courtHighlightTimer) clearTimeout(courtHighlightTimer);
    courtHighlightExpiry[zone] = nextExpiry;
    courtHighlightTimer = setTimeout(function(){
      if(courtHighlightZone === zone) courtHighlightZone = null;

      renderZones();
      fitPlayerNameText();
    }, Math.max(0, nextExpiry - now));

  function playerNameFitKey(text, chipWidth, chipHeight){
    const legacy = document.documentElement.classList.contains('legacyIpad') ? 'legacy' : 'modern';
    return legacy + '|' + playerNameScale() + '|' + state.settings.playerNameFont + '|' + text + '|' + Math.round(chipWidth) + 'x' + Math.round(chipHeight);
  }

  function playerNameScale(){
    const scale = Number(state.settings.playerNameScale) || 100;
    return normalizePlayerNameScale(scale);
  }

  function normalizePlayerNameScale(value){
    const scale = Number(value);
    const supported = [85,92,100,108];
    if(!Number.isFinite(scale)) return 100;
    let best = 100;
    let bestDistance = Math.abs(scale - best);
    for(let i = 0; i < supported.length; i += 1){
      const distance = Math.abs(scale - supported[i]);
      if(distance < bestDistance){
        best = supported[i];
        bestDistance = distance;
      }
    }
    return best;
  }

  function playerNameFontFamily(){
    const font = state.settings.playerNameFont || 'system';
    if(font === 'serif') return '"Noto Serif TC","Songti TC","PMingLiU",serif';
    if(font === 'bold') return '"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';
    return '-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  }

  function fitOnePlayerName(nameEl){
    if(!nameEl || !nameEl.parentNode) return;
    const chip = nameEl.parentNode;
    const chipWidth = chip.clientWidth || chip.offsetWidth || 0;
    const chipHeight = chip.clientHeight || chip.offsetHeight || 0;
    if(chipWidth < 24 || chipHeight < 24) return;
    const text = String(nameEl.textContent || '');
    const fitKey = playerNameFitKey(text, chipWidth, chipHeight);
    if(playerNameFitCache[fitKey]){
      nameEl.style.fontSize = playerNameFitCache[fitKey] + 'px';
      nameEl.style.lineHeight = '1.05';
      return;
    }
    const scale = playerNameScale() / 100;
    const legacy = document.documentElement.classList.contains('legacyIpad');
    let maxSize = Math.round((text.length <= 2 ? 44 : (text.length <= 4 ? 42 : 40)) * scale);
    let minSize = Math.max(14, Math.round(20 * scale));
    if(legacy){
      minSize = Math.max(18, Math.round(22 * scale));
    }else{
      const heightCap = Math.max(20, Math.round(chipHeight * 0.48));
      maxSize = Math.min(maxSize, heightCap);
      minSize = Math.min(minSize, Math.max(14, heightCap - 8));
    }
    nameEl.style.fontSize = maxSize + 'px';
    nameEl.style.lineHeight = '1.05';
    const maxWidth = Math.max(24, chipWidth - 18);
    const maxHeight = Math.max(20, chipHeight - 12);
    let size = maxSize;
    while(size > minSize && (nameEl.scrollWidth > maxWidth || nameEl.scrollHeight > maxHeight)){
      size -= 1;
      nameEl.style.fontSize = size + 'px';
    }
    playerNameFitCache[fitKey] = size;
  }

  function readableTextColor(color){
    const hex = String(color || '').replace('#','');
    if(hex.length !== 6) return '#0f172a';
    const r = parseInt(hex.slice(0,2), 16);
    const g = parseInt(hex.slice(2,4), 16);
    const b = parseInt(hex.slice(4,6), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
    return luminance > 150 ? '#0f172a' : '#ffffff';
  }

      logAction('moveToRest','rest',[p.name],`${zoneLabel(oldZone)} → 休息區`);
      saveState();
      return true;
    }

    targetSlot = Number(targetSlot);
    if(!SLOTS.includes(targetSlot)) return false;
    const target = occupant(targetZone, targetSlot);
    if(target && target.id !== p.id){
      target.zone = oldZone;
      target.slot = oldZone === 'rest' ? null : oldSlot;
      target.updatedAt = nowIso();
    }
    p.zone = targetZone;
    p.slot = targetSlot;
    p.updatedAt = nowIso();
    logAction('movePlayer',targetZone,[p.name],`${zoneLabel(oldZone)} → ${zoneLabel(targetZone)} #${targetSlot}`);
    saveState();
    return true;
  }

  async function courtDown(courtZone){
    const players = zonePlayers(courtZone);
    if(players.length === 0){ showToast('這個球場目前沒有人'); return; }
    const ok = await confirmDialog(`${zoneLabel(courtZone)} 下場`, '', courtDownConfirmHtml(players), '下場', 'court-down-ok');
    if(!ok) return;
    if(courtEntryAnimationLocked && courtEntryAnimationShouldRun()){
      showToast('上場動畫進行中');
      return;
    }
    players.forEach(p => { p.games = (Number(p.games)||0)+1; p.updatedAt=nowIso(); });
    if(state.settings.autoArrangeMode){
      await autoArrangeCourtDown(courtZone, players);
    }else{
      players.forEach(p => { p.zone='rest'; p.slot=null; p.updatedAt=nowIso(); });
      logAction('courtDown',courtZone,players.map(p=>p.name),'下場並場次 +1');
    }
    if(selectedPlayer && players.some(p => p.id === selectedPlayer.playerId)) setSelectedPlayer(null);
    saveState();
    showToast(`${zoneLabel(courtZone)} 已下場`);
    render();
  }

  async function autoArrangeCourtDown(courtZone, players){
    players.forEach(p => { p.zone='rest'; p.slot=null; p.updatedAt=nowIso(); });
    await autoNextUpToCourt('next1', courtZone, true);
    const sorted = shuffleTiesByGames(players);
    const nextSlots = emptySlots(activeNexts());
    const placed = [];
    const overflow = [];
    sorted.forEach((p, i) => {
      const target = nextSlots[i];
      if(target){
        p.zone = target.zone;
        p.slot = target.slot;
        placed.push(p.name);
      }else{
        p.zone = 'rest';
        p.slot = null;
        overflow.push(p.name);
      }
      p.updatedAt = nowIso();
    });
    logAction('autoCourtDown',courtZone,sorted.map(p=>p.name),`下場 +1，排入 Next：${placed.join('、') || '無'}${overflow.length ? '；回休息區：' + overflow.join('、') : ''}`);
    if(overflow.length){
      await alertDialog('Next 空位不足', 'Next 空位不足，已依規則能放幾個放幾個，剩下回休息區。', `<div class="backup-summary">回休息區：${overflow.map(escapeHtml).join('、')}</div>`);
    }
  }

  function emptySlots(zones){
    const slots = [];
    zones.forEach(zone => SLOTS.forEach(slot => {
      if(!occupant(zone, slot)) slots.push({zone, slot});
    }));
    return slots;
  }

  function shuffleTiesByGames(players){
    return players
      .map(p => ({p, tie:Math.random()}))
      .sort((a,b) => ((Number(a.p.games)||0) - (Number(b.p.games)||0)) || (a.tie - b.tie))
      .map(item => item.p);
  }

  function validRect(rect){
    return !!(rect && rect.width > 1 && rect.height > 1);
  }

    const chips = document.querySelectorAll('.player-chip');
    for(let i = 0; i < chips.length; i += 1){
      if(dataAttr(chips[i], 'player-id') === playerId) return chips[i];
    }
    return null;
  }

  function findSlotElement(zone, slot){
    const slots = document.querySelectorAll('.slot');
    for(let i = 0; i < slots.length; i += 1){
      if(dataAttr(slots[i], 'zone') === zone && Number(dataAttr(slots[i], 'slot')) === Number(slot)) return slots[i];
    }
    return null;
  }

  function findZoneCardElement(zone){
    const cards = document.querySelectorAll('.zone-card');
    for(let i = 0; i < cards.length; i += 1){
      if(dataAttr(cards[i], 'zone-card') === zone) return cards[i];
    }
    return null;
  }

  function copyRect(rect){
    return {left:rect.left, top:rect.top, width:rect.width, height:rect.height};
  }

  function prepareCourtEntryAnimation(nextZone, courtZone){
    if(nextZone !== 'next1' || !courtEntryAnimationShouldRun()) return null;
    if(courtEntryAnimationLocked) return {locked:true};
    const players = zonePlayers(nextZone).slice(0, 4).sort((a,b)=>(a.slot||99)-(b.slot||99));
    if(!players.length) return null;
    const items = [];
    for(let i = 0; i < players.length; i += 1){
      const player = players[i];
      const sourceEl = findPlayerChipElement(player.id);
      const targetEl = findSlotElement(courtZone, i + 1);
      if(!sourceEl || !targetEl) return null;
      const sourceRect = copyRect(sourceEl.getBoundingClientRect());
      const targetRect = copyRect(targetEl.getBoundingClientRect());
      if(!validRect(sourceRect) || !validRect(targetRect)) return null;
      items.push({playerId:player.id, sourceRect, targetRect, sourceHtml:sourceEl.outerHTML || playerChipHtml(player), index:i});
    }
    const card = findZoneCardElement(courtZone);
    if(card) card.classList.add('entry-pre-pulse','call-' + callEffectColorClass(),'call-' + callEffectIntensityClass());
    setTimeout(function(){ if(card) card.classList.remove('entry-pre-pulse'); }, 260);
    courtEntryAnimationLocked = true;
    items.forEach(function(item){ courtEntryHidden[item.playerId] = true; });
    return {courtZone, items};
  }

  function cleanupCourtEntryAnimation(capture){
    if(capture && capture.items){
      capture.items.forEach(function(item){ delete courtEntryHidden[item.playerId]; });
    }
    courtEntryAnimationLocked = false;
  }

  function runCourtEntryAnimation(capture){
    if(!capture || capture.locked || !capture.items || !capture.items.length){
      if(capture && capture.locked) showToast('上場動畫進行中');
      return;
    }
    try{
      const overlay = document.createElement('div');
      overlay.className = 'entry-animation-overlay';
      overlay.setAttribute('aria-hidden', 'true');
      const clones = capture.items.map(function(item){
        const wrapper = document.createElement('div');
        wrapper.className = 'entry-fly-clone';
        wrapper.innerHTML = item.sourceHtml;
        wrapper.style.left = item.sourceRect.left + 'px';
        wrapper.style.top = item.sourceRect.top + 'px';
        wrapper.style.width = item.sourceRect.width + 'px';
        wrapper.style.height = item.sourceRect.height + 'px';
        overlay.appendChild(wrapper);
        return {el:wrapper, item};
      });
      document.body.appendChild(overlay);
      const raf = window.requestAnimationFrame || function(fn){ return setTimeout(fn, 0); };
      raf(function(){
        clones.forEach(function(pair){
          pair.el.classList.add('lift');
        });
        setTimeout(function(){
          clones.forEach(function(pair){
            const item = pair.item;
            const dx = item.targetRect.left - item.sourceRect.left;
            const dy = item.targetRect.top - item.sourceRect.top;
            const sx = item.targetRect.width / item.sourceRect.width;
            const sy = item.targetRect.height / item.sourceRect.height;
            setTimeout(function(){
              pair.el.classList.add('arrive');
              pair.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';
              setTimeout(function(){
                pair.el.classList.add('settle');
                pair.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + (sx * 0.98).toFixed(3) + ',' + (sy * 0.98).toFixed(3) + ')';
              }, 420);
            }, item.index * 40);
          });
        }, 130);
      });
      setTimeout(function(){
        if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
        cleanupCourtEntryAnimation(capture);
        renderZones();
        fitPlayerNameText();
      }, 1020);
    }catch(err){
      cleanupCourtEntryAnimation(capture);
      renderZones();
      fitPlayerNameText();
    }
  }

  function queueCourtEntryAnimation(capture){
    if(capture && !capture.locked && capture.items && capture.items.length) pendingCourtEntryAnimation = capture;
  }

  function runPendingCourtEntryAnimation(){
    const capture = pendingCourtEntryAnimation;
    pendingCourtEntryAnimation = null;
    if(capture) runCourtEntryAnimation(capture);
  }

  function firstEmptyCourt(){
    return activeCourts().find(z => zonePlayers(z).length === 0) || null;

  async function confirmPartialNextUp(nextZone, count){
    if(count >= 4) return true;
    return await confirmDialog('Next 未滿 4 人', `${zoneLabel(nextZone)} 目前只有 ${count}/4 人，仍要上場嗎？`, '');
  }

  async function nextUp(nextZone){
    const players = zonePlayers(nextZone);
    if(players.length === 0){ showToast('這組 Next 沒有人'); return; }
    const court = firstEmptyCourt();
    if(!court){ await alertDialog('目前沒有空球場', '沒有完全空的 Court，所有位置不動。'); return; }
    if(state.settings.autoArrangeMode){
      await autoNextUpToCourt(nextZone, court, false);
      saveState();
      render();
      return;
    }
    if(!(await confirmPartialNextUp(nextZone, players.length))) return;
    const sorted = players.sort((a,b)=>(a.slot||99)-(b.slot||99));
    sorted.forEach((p,i) => { p.zone = court; p.slot = i+1; p.updatedAt = nowIso(); });
    const names = sorted.map(p=>p.name);
    state.settings.lastCallPlayers = names;
    state.settings.lastCallCourt = court;
    logAction('nextUp',court,names,`${zoneLabel(nextZone)} 上場到 ${zoneLabel(court)}`);
    markCourtCallTarget(court);
    saveState();
    showToast(`${zoneLabel(nextZone)} 已上場`);
    render();
    if(state.settings.autoCallEnabled) callPlayers(names, court);
  }

  async function autoNextUpToCourt(nextZone, court, fromCourtDown){
    const players = zonePlayers(nextZone);
    if(players.length === 0){
      if(fromCourtDown) await alertDialog('Next 1 無人上場', '下場後 Next 1 沒有人可自動上場，剛空出的 Court 保持空場。');
      return false;
    }
    if(!(await confirmPartialNextUp(nextZone, players.length))) return false;
    const sorted = players.sort((a,b)=>(a.slot||99)-(b.slot||99));
    const entryAnimation = fromCourtDown ? prepareCourtEntryAnimation(nextZone, court) : null;
    sorted.forEach((p,i) => { p.zone = court; p.slot = i+1; p.updatedAt = nowIso(); });
    const names = sorted.map(p=>p.name);
    state.settings.lastCallPlayers = names;
    state.settings.lastCallCourt = court;
    shiftNextForwardAfter(nextZone);
    logAction('autoNextUp',court,names,`${zoneLabel(nextZone)} 上場到 ${zoneLabel(court)}，Next 向前遞補`);
    markCourtCallTarget(court);
    queueCourtEntryAnimation(entryAnimation);
    showToast(`${zoneLabel(nextZone)} 已上場`);
    if(state.settings.autoCallEnabled) callPlayers(names, court);
    return true;
  }

  function shiftNextForwardAfter(nextZone){
    const nexts = activeNexts();
    const start = nexts.indexOf(nextZone);
    if(start < 0) return;
    for(let i=start + 1;i<nexts.length;i++){
      const from = nexts[i];
      const to = nexts[i - 1];
      zonePlayers(from).forEach(p => {
        p.zone = to;
        p.updatedAt = nowIso();
      });
    }
  }

  async function randomFillCourts(){
    const empty = [];
    activeCourts().concat(activeNexts()).forEach(z => SLOTS.forEach(slot => { if(!occupant(z, slot)) empty.push({zone:z, slot}); }));
    if(empty.length === 0){ await alertDialog('場地已滿', 'Court 與 Next 都已滿，所有位置不動。'); return; }
    const rest = restPlayers();
    if(rest.length === 0){ showToast('休息區目前沒有人'); return; }
    const shuffled = rest.slice().sort(() => Math.random() - 0.5);
    const count = Math.min(empty.length, shuffled.length);
    const moved = [];
    for(let i=0;i<count;i++){
      const p = shuffled[i];
      p.zone = empty[i].zone;
      p.slot = empty[i].slot;
      p.updatedAt = nowIso();
      moved.push(p.name);
    }
    logAction('randomFillCourts','courts-next',moved,'隨機填滿 Court 與 Next 空格');
    saveState();
    render();
    if(count < shuffled.length) await alertDialog('場地已滿', '場地已滿，剩餘人員留在休息區。');
    else if(count < empty.length) showToast('休息區人數不足，已填入可用球員');
    else showToast('已隨機填滿場地');
  }

  function courtVoiceText(courtZone){
    if(!courtZone) return '請上場。';
    return '請到' + courtLabel(courtZone) + '號場';
  }

  function detectNameLanguage(name){
    const text = String(name || '');
    if(/[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(text)) return 'zh-TW';
    if(/[A-Za-z]/.test(text)) return 'en-US';
    return 'zh-TW';
  }

  function speechRate(){
    const rate = state.settings.voiceRate;
    return rate === 'slow' ? 0.78 : rate === 'fast' ? 1.18 : 0.95;
  }

  function speechPitch(){
    const pitch = state.settings.voicePitch;
    return pitch === 'low' ? 0.82 : pitch === 'high' ? 1.18 : 1;
  }

  function availableVoices(){
    try{
      return window.speechSynthesis && window.speechSynthesis.getVoices ? (window.speechSynthesis.getVoices() || []) : [];
    }catch(err){
      return [];
    }
  }

  function voiceText(voice){
    return String((voice && voice.lang ? voice.lang : '') + ' ' + (voice && voice.name ? voice.name : ''));
  }

  function voiceId(voice){
    if(!voice) return '';
    return voice.voiceURI ? String(voice.voiceURI) : String((voice.name || '') + '|' + (voice.lang || ''));
  }

  function isChineseVoice(voice){
    return /zh|cmn|mandarin|chinese|taiwan/i.test(voiceText(voice));
  }

  function isEnglishVoice(voice){
    return /(^|\s)en[-_]|english/i.test(voiceText(voice));
  }

  function uniqueVoices(filterFn){
    const voices = availableVoices();
    const seen = {};
    const result = [];
    for(let i = 0; i < voices.length; i += 1){
      const voice = voices[i];
      if(!filterFn(voice)) continue;
      const id = voiceId(voice);
      if(!id || seen[id]) continue;
      seen[id] = true;
      result.push(voice);
    }
    return result;
  }

  function findVoiceById(id){
    if(!id) return null;
    const voices = availableVoices();
    for(let i = 0; i < voices.length; i += 1){
      if(voiceId(voices[i]) === id) return voices[i];
    }
    return null;
  }

  function findPreferredVoice(lang){
    const voices = availableVoices();
    if(!voices.length) return null;
    const exactLang = String(lang || '').toLowerCase();
    function exact(voice){ return String(voice.lang || '').toLowerCase() === exactLang; }
    const exactLocal = voices.find(function(voice){ return exact(voice) && voice.localService; });
    if(exactLocal) return exactLocal;
    const exactAny = voices.find(exact);
    if(exactAny) return exactAny;

    const fallbackPattern = lang === 'en-US' ? /(^|\s)en[-_]|english/i : /zh|cmn|mandarin|chinese|taiwan/i;
    const fallbackLocal = voices.find(function(voice){ return fallbackPattern.test(voiceText(voice)) && voice.localService; });
    if(fallbackLocal) return fallbackLocal;
    return voices.find(function(voice){ return fallbackPattern.test(voiceText(voice)); }) || null;
  }

  function findSelectedVoice(lang){
    const id = lang === 'en-US' ? state.settings.enVoiceId : state.settings.zhVoiceId;
    const selected = findVoiceById(id);
    if(selected) return selected;
    return findPreferredVoice(lang);
  }

  function createCallUtterance(text, lang){
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang;
    utter.rate = speechRate();
    utter.pitch = speechPitch();
    const voice = findSelectedVoice(lang);
    if(voice) utter.voice = voice;
    return utter;
  }

  function localVoiceSpec(language){
    return LOCAL_VOICE_SPECS[language] || LOCAL_VOICE_SPECS['zh-TW'];
  }

  function localVoiceKey(type, spokenText, language){
    const spec = localVoiceSpec(language);
    return [LOCAL_VOICE_SPEC_VERSION, type, language, spec.voice, spec.rate, spokenText].join('|');
  }

  function openLocalVoiceDb(){
    if(!('indexedDB' in window)) return Promise.resolve(null);
    if(localVoiceDbPromise) return localVoiceDbPromise;
    localVoiceDbPromise = new Promise(function(resolve, reject){
      const req = indexedDB.open(LOCAL_VOICE_DB, 1);
      req.onupgradeneeded = function(){
        const db = req.result;
        if(!db.objectStoreNames.contains(LOCAL_VOICE_STORE)){
          db.createObjectStore(LOCAL_VOICE_STORE, {keyPath:'key'});
        }
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error || new Error('IndexedDB open failed')); };
    }).catch(function(err){
      console.error(err);
      return null;
    });
    return localVoiceDbPromise;
  }

  function localVoiceTransaction(mode, callback){
    return openLocalVoiceDb().then(function(db){
      if(!db){
        return callback({
          get:function(key){ return Promise.resolve(memoryVoiceAssets[key] || null); },
          put:function(record){ memoryVoiceAssets[record.key] = record; return Promise.resolve(record); },
          delete:function(key){ delete memoryVoiceAssets[key]; return Promise.resolve(); },
          getAll:function(){ return Promise.resolve(Object.keys(memoryVoiceAssets).map(function(key){ return memoryVoiceAssets[key]; })); },
          clear:function(){ memoryVoiceAssets = {}; return Promise.resolve(); }
        });
      }
      return new Promise(function(resolve, reject){
        const tx = db.transaction(LOCAL_VOICE_STORE, mode);
        const store = tx.objectStore(LOCAL_VOICE_STORE);
        const api = {
          get:function(key){ return requestToPromise(store.get(key)); },
          put:function(record){ return requestToPromise(store.put(record)); },
          delete:function(key){ return requestToPromise(store.delete(key)); },
          getAll:function(){ return requestToPromise(store.getAll()); },
          clear:function(){ return requestToPromise(store.clear()); }
        };
        Promise.resolve(callback(api)).then(resolve).catch(reject);
        tx.onerror = function(){ reject(tx.error || new Error('IndexedDB transaction failed')); };
      });
    });
  }

  function requestToPromise(req){
    return new Promise(function(resolve, reject){
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error || new Error('IndexedDB request failed')); };
    });
  }

  function edgeSpokenName(name){
    const raw = String(name || '').replace(/^\s+|\s+$/g, '');
    const suffixMatch = raw.match(/^(.+?)\s*(哥|姊)$/);
    if(suffixMatch && detectNameLanguage(suffixMatch[1]) === 'en-US'){
      return suffixMatch[1].replace(/^\s+|\s+$/g, '');
    }
    return raw;
  }

  function voiceAssetDescriptor(type, spokenText, language){
    const text = String(spokenText || '').replace(/^\s+|\s+$/g, '');
    const spec = localVoiceSpec(language);
    return {
      key:localVoiceKey(type, text, language),
      type:type,
      spokenText:text,
      language:language,
      voice:spec.voice,
      rate:spec.rate,
      specVersion:LOCAL_VOICE_SPEC_VERSION
    };
  }

  function requiredLocalVoiceAssets(names, includeCourts, includePrepare){
    const seen = {};
    const list = [];
    function add(desc){
      if(!desc.spokenText || seen[desc.key]) return;
      seen[desc.key] = true;
      list.push(desc);
    }
    (names || []).forEach(function(name){
      const spoken = edgeSpokenName(name);
      if(spoken) add(voiceAssetDescriptor('player', spoken, detectNameLanguage(spoken)));
    });
    if(includeCourts){
      activeCourts().forEach(function(court){
        const label = courtLabel(court);
        add(voiceAssetDescriptor('court', '請到' + label + '號場', 'zh-TW'));
      });
    }
    if(includePrepare) add(voiceAssetDescriptor('system', '請準備', 'zh-TW'));
    return list;
  }

  function requiredLocalVoiceAssetsForToday(){
    return requiredLocalVoiceAssets(restPlayerNamesForEdgeCheck(), true, true);
  }

  function localVoiceGet(key){
    return localVoiceTransaction('readonly', function(store){ return store.get(key); });
  }

  function localVoicePut(record){
    return localVoiceTransaction('readwrite', function(store){ return store.put(record); });
  }

  function localVoiceGetAll(){
    return localVoiceTransaction('readonly', function(store){ return store.getAll(); });
  }

  function localVoiceDelete(key){
    return localVoiceTransaction('readwrite', function(store){ return store.delete(key); });
  }

  function localVoiceClear(type){
    return localVoiceGetAll().then(function(records){
      return localVoiceTransaction('readwrite', function(store){
        const tasks = [];
        records.forEach(function(record){
          if(!type || record.type === type) tasks.push(store.delete(record.key));
        });
        return Promise.all(tasks);
      });
    });
  }

  function validLocalVoiceRecord(record, desc){
    return !!(record && record.blob && record.type === desc.type && record.spokenText === desc.spokenText && record.language === desc.language && record.voice === desc.voice && record.rate === desc.rate && record.specVersion === desc.specVersion);
  }

  function descriptorLabel(desc){
    if(!desc) return '';
    if(desc.type === 'player') return '球員：' + desc.spokenText;
    if(desc.type === 'court') return '場地：' + desc.spokenText;
    if(desc.type === 'system') return '系統：' + desc.spokenText;
    return desc.spokenText || '';
  }

  async function localVoiceCheck(descs){
    const missing = [];
    const ready = [];
    for(let i = 0; i < descs.length; i += 1){
      const desc = descs[i];
      const record = await localVoiceGet(desc.key);
      if(validLocalVoiceRecord(record, desc)) ready.push(desc);
      else missing.push(desc);
    }
    return {ready:ready, missing:missing, total:descs.length};
  }

  function localVoiceCounts(descs, ready){
    const counts = {system:0, player:0, court:0, systemReady:0, playerReady:0, courtReady:0};
    (descs || []).forEach(function(desc){ counts[desc.type] += 1; });
    (ready || []).forEach(function(desc){ counts[desc.type + 'Ready'] += 1; });
    counts.systemMissing = counts.system - counts.systemReady;
    counts.playerMissing = counts.player - counts.playerReady;
    counts.courtMissing = counts.court - counts.courtReady;
    return counts;
  }

    return 'Edge 缺少 ' + missing.length + ' 個本機音源\n球員 ' + counts.playerMissing + '　場地 ' + counts.courtMissing + '　系統 ' + counts.systemMissing + '\n請至「本機音源」產生';

  async function fetchGeneratedVoice(desc){
    const response = await fetch(LOCAL_VOICE_API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:desc.spokenText, language:desc.language})
    });
    const type = response && response.headers && response.headers.get ? String(response.headers.get('Content-Type') || '') : '';
    if(!response || !response.ok || type.toLowerCase().indexOf('audio/mpeg') < 0) throw new Error('voice generate failed');
    const blob = await response.blob();
    if(!blob || Number(blob.size || 0) <= 0) throw new Error('empty voice asset');
    return blob;
  }

  async function generateMissingVoiceAssets(){
    const status = $('voiceGenerateStatus');
    if(localVoiceGenerating) return {ok:false, reason:'generating'};
    if(navigator.onLine === false){
      if(status) status.textContent = '目前沒有網路連線，請連線後產生音源。';
      showToast('目前沒有網路連線');
      return {ok:false, reason:'offline'};
    }
    localVoiceGenerating = true;
    renderPanel();
    const descs = requiredLocalVoiceAssetsForToday();
    const initial = await localVoiceCheck(descs);
    if(!initial.missing.length){
      if(status) status.textContent = '本機音源已完整';
      await refreshLocalVoiceStatus();
      localVoiceGenerating = false;
      renderPanel();
      return {ok:true, generated:0, failed:[]};
    }
    const failed = [];
    let generated = 0;
    try{
      for(let i = 0; i < initial.missing.length; i += 1){
        const desc = initial.missing[i];
        if(status) status.textContent = '正在建立音源 ' + (i + 1) + ' / ' + initial.missing.length + '\n' + desc.spokenText;
        try{
          const blob = await fetchGeneratedVoice(desc);
          await localVoicePut(Object.assign({}, desc, {blob:blob, createdAt:nowIso()}));
          generated += 1;
        }catch(err){
          console.error(err);
          failed.push(desc.spokenText);
        }
        await refreshLocalVoiceStatus();
      }
    }finally{
      localVoiceGenerating = false;
    }
    const finalCheck = await localVoiceCheck(descs);
    if(status){
      status.textContent = finalCheck.missing.length
        ? '仍缺少音源：' + finalCheck.missing.map(function(desc){ return desc.spokenText; }).join('、')
        : '✓ 本機音源 Ready';
    }
    if(currentAutoCallMode() === 'edge'){
      if(finalCheck.missing.length){
        edgeCheckState = 'MISSING';
        setAutoCallMode('off');
        saveState();
        setEdgeReadyStatus(missingVoiceSummary(descs, finalCheck.missing), 'missing');
      }else{
        edgeCheckState = 'READY';
        setAutoCallMode('edge');
        saveState();
        setEdgeReadyStatus('✓ 本機音源 Ready\n✓ Edge 固定語音已啟用\n目前音源已完整，你可以離線作業。', 'ready');
      }
    }
    renderPanel();
    return {ok:finalCheck.missing.length === 0, generated:generated, failed:failed, missing:finalCheck.missing.map(function(desc){ return desc.spokenText; })};
  }

  async function localVoiceUrlsForDescriptors(descs){

  function stopCurrentCallAudio(){

  function playAudioUrl(url, token, done){
    if(!url || typeof Audio === 'undefined'){ done(false); return; }
    let audio;
    let finished = false;
    let startTimer = null;
    function finish(ok){
      if(finished) return;
      finished = true;
      if(startTimer) clearTimeout(startTimer);
      if(!ok && audio){
        try{ audio.pause(); }catch(err){}
        try{ audio.src = ''; }catch(err){}
      }
      if(activeCallAudio === audio) activeCallAudio = null;
      done(!!ok);
    }
    function started(){
      if(startTimer){
        clearTimeout(startTimer);
        startTimer = null;
      }
    }
    try{
      audio = new Audio(url);
      activeCallAudio = audio;
      audio.preload = 'auto';
      audio.onended = function(){ finish(true); };
      audio.onerror = function(){ finish(false); };
      audio.onplay = started;
      audio.onplaying = started;
      const played = audio.play();
      if(played && played.then) played.then(started).catch(function(){ finish(false); });
      startTimer = setTimeout(function(){ finish(false); }, 1800);
    }catch(err){
      finish(false);
    }
  }

  function validateAudioUrl(url, token, done){
    if(!url || typeof Audio === 'undefined'){ done(false); return; }
    let audio;
    let finished = false;
    let timer = null;
    function finish(ok){
      if(finished) return;
      finished = true;
      if(timer) clearTimeout(timer);
      if(audio){
        try{ audio.src = ''; }catch(err){}
      }
      done(!!ok && token === speechCallToken);
    }
    try{
      audio = new Audio(url);
      audio.preload = 'auto';
      audio.oncanplaythrough = function(){ finish(true); };
      audio.oncanplay = function(){ finish(true); };
      audio.onloadeddata = function(){ finish(true); };
      audio.onerror = function(){ finish(false); };
      if(audio.readyState >= 2){ finish(true); return; }
      if(audio.load) audio.load();
      timer = setTimeout(function(){ finish(false); }, 1600);
    }catch(err){
      finish(false);
    }
  }

  function validateAudioParts(urls, token, done){
    let index = 0;
    function next(){
      if(token !== speechCallToken){ done(false); return; }
      if(index >= urls.length){ done(true); return; }
      validateAudioUrl(urls[index], token, function(ok){
        if(!ok){ done(false); return; }
        index += 1;
        next();
      });
    }
    next();
  }

  function validateAudioPartsAsync(urls){

  function waitForMeasurablePlayerNames(){
    return new Promise(function(resolve){
      const check = function(tries){
        const names = document.querySelectorAll('.player-chip .name');
        let measurable = names.length === 0;
        for(let i = 0; i < names.length; i += 1){
          const rect = names[i].getBoundingClientRect();
          const chipRect = names[i].parentNode ? names[i].parentNode.getBoundingClientRect() : {width:0, height:0};
          if(rect.width > 0 && rect.height > 0 && chipRect.width > 0 && chipRect.height > 0){
            measurable = true;
            break;
          }
        }
        if(measurable || tries <= 0){
          resolve();
          return;
        }
        if(window.requestAnimationFrame) window.requestAnimationFrame(function(){ check(tries - 1); });
        else setTimeout(function(){ check(tries - 1); }, 16);
      };
      check(5);
    });
  }

  async function speakCallSequence(names, courtZone, forcedMode){
    const token = ++speechCallToken;
    const synth = window.speechSynthesis;
    const mode = forcedMode === 'edge' ? 'edge' : (forcedMode === 'browser' ? 'browser' : (currentAutoCallMode() === 'edge' ? 'edge' : 'browser'));
    const parts = mode === 'edge' ? edgeCallSequenceParts(names, courtZone) : browserCallSequenceParts(names, courtZone);
    const nameGap = 90;
    const courtGap = 110;
    stopCurrentCallAudio();
    try{
      if(synth.cancel) synth.cancel();
    }catch(err){}
    async function speakNext(index){
      if(token !== speechCallToken || index >= parts.length) return;
      const part = parts[index];
      const next = function(){
        if(token !== speechCallToken) return;
        const isBeforeCourt = index === parts.length - 2;
        setTimeout(function(){ speakNext(index + 1); }, isBeforeCourt ? courtGap : nameGap);
      };
      if(mode === 'edge'){
        const local = await localVoiceUrlsForDescriptors(part.descriptors || []);
        if(local.missing.length){
          setEdgeReadyStatus(missingVoiceSummary(part.descriptors || [], local.missingDescriptors), 'missing');
          return;
        }
        playAudioParts(local.urls, token, function(ok){
          local.urls.forEach(function(url){ try{ URL.revokeObjectURL(url); }catch(err){} });
          if(ok) next();
          else setEdgeReadyStatus('Edge 音源檢查失敗，請重新嘗試', 'error');
        }, 0);
        return;

  function prepareSequenceParts(names, mode){
    const parts = names.map(function(name){
      const text = String(name || '').replace(/^\s+|\s+$/g, '');
      return mode === 'edge'
        ? {text:text, spokenText:edgeSpokenName(text), lang:detectNameLanguage(edgeSpokenName(text)), descriptors:requiredLocalVoiceAssets([text], false, false), type:'name'}
        : {text:text, lang:detectNameLanguage(text), type:'name'};
    }).filter(function(part){ return part.text; });
    parts.push(mode === 'edge'
      ? {text:'請準備', spokenText:'請準備', lang:'zh-TW', descriptors:[voiceAssetDescriptor('system', '請準備', 'zh-TW')], type:'prepare'}
      : {text:'請準備', lang:'zh-TW', type:'prepare'}
    );
    return parts;
  }

  async function speakPartsSequence(parts, mode){
    const token = ++speechCallToken;
    const synth = window.speechSynthesis;
    const nameGap = 90;
    const prepareGap = 110;
    stopCurrentCallAudio();
    try{
      if(synth && synth.cancel) synth.cancel();
    }catch(err){}
    async function speakNext(index){
      if(token !== speechCallToken || index >= parts.length) return;
      const part = parts[index];
      const next = function(){
        if(token !== speechCallToken) return;
        const isBeforeFinal = index === parts.length - 2;
        setTimeout(function(){ speakNext(index + 1); }, isBeforeFinal ? prepareGap : nameGap);
      };
      if(mode === 'edge'){
        const local = await localVoiceUrlsForDescriptors(part.descriptors || []);
        if(local.missing.length){
          setEdgeReadyStatus(missingVoiceSummary(part.descriptors || [], local.missingDescriptors), 'missing');
          return;
        }
        playAudioParts(local.urls, token, function(ok){
          local.urls.forEach(function(url){ try{ URL.revokeObjectURL(url); }catch(err){} });
          if(ok) next();
          else setEdgeReadyStatus('Edge 音源檢查失敗，請重新嘗試', 'error');
        }, 0);
        return;
      }
      speakTextPart(part, token, next);
    }
    speakNext(0);
  }

  async function prepareFirstNextGroupCall(){
    const names = firstNextGroupNames();
    if(!names.length){
      showToast('目前沒有預備球員');
      return;
    }
    const mode = currentAutoCallMode() === 'edge' ? 'edge' : 'browser';
    const parts = prepareSequenceParts(names, mode);
    if(mode === 'edge'){
      const missing = [];
      const descriptors = [];
      for(let i = 0; i < parts.length; i += 1){
        descriptors.push.apply(descriptors, parts[i].descriptors || []);
      }
      const local = await localVoiceUrlsForDescriptors(descriptors);
      local.urls.forEach(function(url){ try{ URL.revokeObjectURL(url); }catch(err){} });
      missing.push.apply(missing, local.missing);
      if(missing.length){
        setEdgeReadyStatus(missingVoiceSummary(descriptors, local.missingDescriptors), 'missing');
        showToast('Edge 缺少音源');
        return;
      }
    }
    speakPartsSequence(parts, mode);
  }

      const reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result || '')); };
      reader.onerror = function(){ reject(reader.error || new Error('read file failed')); };
      reader.readAsText(file);
    });
  }

  function parsePlayerListText(text){

    try{
      const data = JSON.parse(raw);
      if(Array.isArray(data)) return data.map(normalizePastedPlayerItem).filter(function(p){ return !!p; });
      if(data && Array.isArray(data.players)) return data.players;
    }catch(err){}
    return raw
      .split(/\r?\n/)
      .map(function(line){ return line.replace(/^\s*\[(.*)\]\s*$/, '$1').trim(); })
      .filter(function(name){ return !!name; })
      .map(function(name){ return {name:name, color:COLORS[0]}; });

  function parseRosterEditorNames(text){
    const raw = String(text || '');
    const names = raw
      .split(/\r?\n/)
      .map(function(line){ return line.replace(/^\s*\[(.*)\]\s*$/, '$1').trim(); })
      .filter(function(name){ return !!name; });
    const seen = {};
    const duplicates = [];
    names.forEach(function(name){
      if(seen[name] && duplicates.indexOf(name) < 0) duplicates.push(name);
      seen[name] = true;
    });
    return {names:names, duplicates:duplicates};
  }

  async function saveTodayRosterFromText(text){
    const parsed = parseRosterEditorNames(text);
    if(parsed.duplicates.length){
      showToast('名單有重複姓名');
      return false;
    }
    const currentDuplicates = duplicateActiveRosterNames();
    if(currentDuplicates.length){
      showToast('目前名單有重複姓名，請先修正');
      return false;
    }
    const current = todayRosterPlayers();
    const byName = {};
    current.forEach(function(p){ byName[String(p.name || '').trim()] = p; });
    const unmatchedCurrentBase = [];
    current.forEach(function(p){
      if(parsed.names.indexOf(String(p.name || '').trim()) < 0) unmatchedCurrentBase.push(p);
    });
    const unmatchedNames = parsed.names.filter(function(name){ return !byName[name]; });
    const canPreserveRename = current.length === parsed.names.length && unmatchedCurrentBase.length === unmatchedNames.length;
    const renameByName = {};
    const renamedIds = {};
    if(canPreserveRename){
      for(let i = 0; i < unmatchedNames.length; i += 1){
        const player = unmatchedCurrentBase[i];
        renameByName[unmatchedNames[i]] = player;
        renamedIds[player.id] = true;
      }
    }
    const plannedRemoved = current.filter(function(p){
      const currentName = String(p.name || '').trim();
      return parsed.names.indexOf(currentName) < 0 && !renamedIds[p.id];
    });
    const boardRemoved = plannedRemoved.filter(function(p){ return p.zone !== 'rest'; });
    if(boardRemoved.length){
      const ok = await confirmDialog(
        '移除場上球員',
        '以下球員目前在場地或預備區，確認後只會移除這些球員，不會重排其他位置。',
        '<div class="compact-help">' + escapeHtml(boardRemoved.map(function(p){ return p.name + '（' + zoneLabel(p.zone) + '）'; }).join('、')) + '</div>'
      );
      if(!ok) return false;
    }
    const usedIds = {};
    parsed.names.forEach(function(name, index){
      let player = byName[name] || null;
      if(!player && renameByName[name]){
        player = renameByName[name];
        if(player){
          const old = player.name;
          player.name = name;
          player.updatedAt = nowIso();
          logAction('renamePlayer', player.zone, [name], old + ' → ' + name);
        }
      }
      if(!player){
        player = makeRosterPlayer(name, Date.now() + index);
        state.players.push(player);
        logAction('addPlayer','rest',[name],'更新名單新增球員');
      }
      player.isActive = true;
      if(!Number.isFinite(Number(player.sortOrder))) player.sortOrder = Date.now() + index;
      player.updatedAt = nowIso();
      usedIds[player.id] = true;
    });

    current.forEach(function(p){
      if(usedIds[p.id]) return;
      p.isActive = false;
      p.updatedAt = nowIso();
      logAction('removeFromToday', p.zone, [p.name], '更新名單移除球員');
      if(selectedPlayer && selectedPlayer.playerId === p.id) setSelectedPlayer(null);
    });
    saveState();
    await refitAfterStructuralBoardRender(closeModal);
    showToast('今日名單已更新');
    return true;
  }

  function buildQueryUrl(baseUrl, params){
    const parts = [];
    Object.keys(params || {}).forEach(function(key){
      if(params[key] === undefined || params[key] === null || params[key] === '') return;
      parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(String(params[key])));
    });
    return baseUrl + (baseUrl.indexOf('?') >= 0 ? '&' : '?') + parts.join('&');
  }

  function requestShuttleRosterApi(action, params){
    if(action === 'listEvents'){
      return fetchRosterJson(SHUTTLE_ROSTER_API_BASE + '/sites/' + encodeURIComponent(ROSTER_SITE) + '/events', {
        status:'open',
        from:todayKey(),
        limit:20,
        _ts:Date.now()
      }).then(function(data){
        const rawEvents = rosterArray(data, 'events');
        return {
          ok:true,
          source:ROSTER_SOURCE_PAGE,
          events:rawEvents.map(normalizeRosterEvent).filter(function(event){ return !!event.eventId; })
        };
      });
    }
    if(action === 'previewRoster'){
      const eventId = params && params.eventId ? String(params.eventId).trim() : '';
      if(!eventId) return Promise.reject(new Error('缺少聚會 ID'));
      return fetchRosterJson(SHUTTLE_ROSTER_API_BASE + '/events/' + encodeURIComponent(eventId) + '/roster', {
        _ts:Date.now()
      }).then(function(data){
        const event = normalizeRosterEvent(data && data.event ? data.event : {});
        if(!event.eventId) event.eventId = eventId;
        const players = rosterConfirmedPlayers(data);
        return {
          ok:true,
          source:ROSTER_SOURCE_PAGE,
          event:event,
          players:players,
          summary:data && data.summary ? data.summary : {}
        };
      });
    }
    return Promise.reject(new Error('不支援的報名 API 動作'));
  }

  function rosterArray(data, key){
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data[key])) return data[key];
    if(data && data.data) return rosterArray(data.data, key);
    return [];
  }

  function normalizeRosterEvent(event){
    event = event || {};
    const eventId = event.eventId || event.id || event.event_id || '';
    const date = event.date || event.eventDate || event.event_date || '';
    const title = event.title || event.name || event.eventName || event.event_name || '日安';
    return {
      eventId:String(eventId),
      date:String(date),
      title:String(title),
      status:String(event.status || ''),
      confirmedCount:Number(event.confirmedCount || event.confirmed_count || 0),
      waitingCount:Number(event.waitingCount || event.waiting_count || 0),
      maxPeople:Number(event.maxPeople || event.max_people || 0)
    };
  }

  function rosterConfirmedPlayers(data){
    const lists = [];
    if(data && Array.isArray(data.confirmed)) lists.push(data.confirmed);
    if(data && Array.isArray(data.fixedConfirmed)) lists.push(data.fixedConfirmed);
    if(data && Array.isArray(data.tempConfirmed)) lists.push(data.tempConfirmed);
    const players = [];
    lists.forEach(function(list){
      list.forEach(function(item){ players.push(item); });
    });
    return players
      .filter(function(player){ return player && String(player.name || '').trim(); })
      .sort(function(a, b){
        const ao = Number(a.orderNo || a.order || 999999);
        const bo = Number(b.orderNo || b.order || 999999);
        if(ao !== bo) return ao - bo;
        return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant');
      })
      .map(function(player){
        return {
          name:String(player.name || '').trim(),
          sourceId:String(player.id || player.memberId || ''),
          signupType:String(player.signupType || '')
        };
      });
  }

  function fetchRosterJson(url, params){
    if(!window.fetch) return Promise.reject(new Error('fetch unavailable'));
    return window.fetch(buildQueryUrl(url, params), { cache:'no-store' }).then(function(response){
      if(!response || !response.ok) throw new Error('HTTP ' + (response ? response.status : ''));
      return response.json();
    }).then(function(data){
      if(!data || data.ok === false){
        const message = data && data.error && data.error.message ? data.error.message : (data && data.error ? data.error : '報名 API 回傳失敗');
        throw new Error(message);
      }
      return data && data.data ? data.data : data;
    });
  }

  function jsonpRosterJson(url, params){
    return new Promise(function(resolve, reject){
      const callbackName = '__badmintonRosterJsonp' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const script = document.createElement('script');
      const cleanup = function(){
        try{ delete window[callbackName]; }catch(err){ window[callbackName] = null; }
        if(script.parentNode) script.parentNode.removeChild(script);
      };
      const timer = setTimeout(function(){
        cleanup();
        reject(new Error('JSONP timeout'));
      }, 10000);
      window[callbackName] = function(data){
        clearTimeout(timer);
        cleanup();
        resolve(data);
      };
      script.onerror = function(){
        clearTimeout(timer);
        cleanup();
        reject(new Error('JSONP failed'));
      };
      const query = Object.assign({}, params || {}, { callback:callbackName });
      script.src = buildQueryUrl(url, query);
      document.body.appendChild(script);
    });
  }

  function initPanelScrollGuard(){
    const panel = $('floatPanel');
    if(!panel) return;
    function pointFromTouch(e){
      const t = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
      return {x:t.clientX || 0, y:t.clientY || 0};
    }
    panel.addEventListener('touchstart', function(e){
      const p = pointFromTouch(e);
      panelTouch = {active:true, moved:false, x:p.x, y:p.y, blockUntil:0};
    }, true);
    panel.addEventListener('touchmove', function(e){
      if(!panelTouch.active) return;
      const p = pointFromTouch(e);
      const dx = Math.abs(p.x - panelTouch.x);
      const dy = Math.abs(p.y - panelTouch.y);
      if(dx > 12 || dy > 12){
        panelTouch.moved = true;
        panelTouch.blockUntil = Date.now() + 450;
      }
    }, true);
    panel.addEventListener('touchend', function(){
      if(panelTouch.moved) panelTouch.blockUntil = Date.now() + 450;
      panelTouch.active = false;
    }, true);
  }

  function initFloatingButton(){
    const group = $('floatingGroup');
    const btn = $('floatButton');
    if(!group || !btn) return;
    const pos = state.settings.floating || {side:'left', y:0.45};
    const y = Math.max(74, Math.min(floatingMaxTop(group), window.innerHeight * (Number(pos.y)||0.45)));
    group.style.top = y + 'px';
    group.style.left = pos.side === 'right' ? 'auto' : '12px';
    group.style.right = pos.side === 'right' ? '12px' : 'auto';
    wakeFloatingGroup();

    function pointFromEvent(e){
      const touch = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
      return {x:touch.clientX, y:touch.clientY};
    }
    function startDrag(e){
      wakeFloatingGroup();
      const point = pointFromEvent(e);
      floatingDrag = {active:true, moved:false, startX:point.x, startY:point.y, dx:point.x - group.getBoundingClientRect().left, dy:point.y - group.getBoundingClientRect().top};
      if(btn.setPointerCapture && e.pointerId != null) btn.setPointerCapture(e.pointerId);
    }
    function moveDrag(e){
      if(!floatingDrag.active) return;
      wakeFloatingGroup();
      const point = pointFromEvent(e);
      const moveX = Math.abs(point.x - floatingDrag.startX);
      const moveY = Math.abs(point.y - floatingDrag.startY);
      const threshold = floatingDragThreshold();
      if(!floatingDrag.moved && moveX < threshold && moveY < threshold) return;
      floatingDrag.moved = true;
      const x = Math.max(4, Math.min(window.innerWidth - group.offsetWidth - 4, point.x - floatingDrag.dx));
      const y2 = Math.max(54, Math.min(floatingMaxTop(group), point.y - floatingDrag.dy));
      group.style.left = x + 'px'; group.style.right = 'auto'; group.style.top = y2 + 'px';
      if(e.cancelable) e.preventDefault();
    }
    function endDrag(e){
      if(!floatingDrag.active) return;
      if(btn.releasePointerCapture && e.pointerId != null) btn.releasePointerCapture(e.pointerId);
      const wasMoved = floatingDrag.moved;
      floatingDrag.active = false;
      if(wasMoved){
        snapFloatingButton();
        setTimeout(function(){ floatingDrag.moved = false; }, 0);
        return;
      }
      floatingTapHandledAt = Date.now();
      toggleFloatingPanel();
    }
    if(window.PointerEvent){
      btn.addEventListener('pointerdown', startDrag);
      btn.addEventListener('pointermove', moveDrag);
      btn.addEventListener('pointerup', endDrag);
    }else{
      btn.addEventListener('touchstart', startDrag, {passive:false});
      btn.addEventListener('touchmove', moveDrag, {passive:false});
      btn.addEventListener('touchend', endDrag);
      btn.addEventListener('mousedown', startDrag);
      document.addEventListener('mousemove', moveDrag);
      document.addEventListener('mouseup', endDrag);
    }
    btn.addEventListener('click', (e) => {
      wakeFloatingGroup();
      e.stopPropagation();
      if(Date.now() - floatingTapHandledAt < 500) return;
      if(floatingDrag.moved) return;
      toggleFloatingPanel();
    });
    group.addEventListener('touchstart', wakeFloatingGroup, {passive:true});
    group.addEventListener('pointerdown', wakeFloatingGroup);
    group.addEventListener('click', wakeFloatingGroup);
  }

  function snapFloatingButton(){
    const group = $('floatingGroup') || $('floatButton');
    if(!group) return;
    const rect = group.getBoundingClientRect();
    const side = rect.left + rect.width/2 < window.innerWidth/2 ? 'left' : 'right';
    group.style.left = side === 'left' ? '12px' : 'auto';
    group.style.right = side === 'right' ? '12px' : 'auto';
    const y = Math.max(54, Math.min(floatingMaxTop(group), rect.top));
    group.style.top = y + 'px';
    state.settings.floating = {side, y: y / window.innerHeight};
    saveState();
  }

  async function handleBoardInteraction(e){
    const zoneHead = closestByClass(e.target, 'zone-head');
    if(zoneHead && dataAttr(zoneHead, 'court')){
      if(e.cancelable) e.preventDefault();
      e.stopPropagation();
      debugLog('zone-head courtDown', dataAttr(zoneHead, 'court'));
      await courtDown(dataAttr(zoneHead, 'court'));
      return true;
    }
    if(zoneHead && dataAttr(zoneHead, 'next')){
      if(e.cancelable) e.preventDefault();
      e.stopPropagation();
      debugLog('zone-head nextUp', dataAttr(zoneHead, 'next'));
      await nextUp(dataAttr(zoneHead, 'next'));
      return true;
    }
    if(zoneHead && dataAttr(zoneHead, 'rest-target')){
      if(e.cancelable) e.preventDefault();
      e.stopPropagation();
      if(!selectedPlayer){
        showToast('請先點選球員');
        return true;
      }
      const moved = movePlayer(selectedPlayer.playerId, 'rest', null);
      if(moved){
        debugLog('rest head move success', selectedPlayer.playerId + ' -> rest');
        setSelectedPlayer(null);
        showToast('已回到休息區');
        render();
      }else{
        debugLog('rest head move fail', selectedPlayer.playerId + ' -> rest');
        showToast('移動失敗');
      }
      return true;
    }

    const slot = closestByClass(e.target, 'slot');
    if(slot){
      if(e.cancelable) e.preventDefault();
      e.stopPropagation();
      const chipInSlot = closestByClass(e.target, 'player-chip');
      if(!selectedPlayer){
        if(chipInSlot){
          debugLog('slot select chip', dataAttr(chipInSlot, 'player-id') + ' -> ' + dataAttr(slot, 'zone') + ':' + dataAttr(slot, 'slot'));
          selectPlayer(dataAttr(chipInSlot, 'player-id'), {closePanelAfterSelect:false});
        }else{
          debugLog('slot empty no selected', dataAttr(slot, 'zone') + ':' + dataAttr(slot, 'slot'));
          showToast('請先點選球員');
        }
        return true;
      }
      const targetZone = dataAttr(slot, 'zone');
      const targetSlot = Number(dataAttr(slot, 'slot'));
      const moved = movePlayer(selectedPlayer.playerId, targetZone, targetSlot);
      if(moved){
        debugLog('slot move success', selectedPlayer.playerId + ' -> ' + targetZone + ':' + targetSlot);
        setSelectedPlayer(null);
        showToast('已移動');
        render();
      }else{
        debugLog('slot move fail', selectedPlayer.playerId + ' -> ' + targetZone + ':' + targetSlot);
        showToast('移動失敗');
      }
      return true;
    }

    const chip = closestByClass(e.target, 'player-chip');
    if(chip){
      if(e.cancelable) e.preventDefault();
      e.stopPropagation();
      const inRest = !!closestById(chip, 'restList') || !!closestByClass(chip, 'rest-board-card');
      debugLog(inRest ? 'chip rest select' : 'chip board select', dataAttr(chip, 'player-id'));
      selectPlayer(dataAttr(chip, 'player-id'), {closePanelAfterSelect:!!closestById(chip, 'restList')});
      return true;
    }

    const restTarget = closestByClass(e.target, 'rest-board-drop');
    if(restTarget){
      if(e.cancelable) e.preventDefault();
      e.stopPropagation();
      if(!selectedPlayer){
        showToast('請先點選球員');
        return true;
      }
      const moved = movePlayer(selectedPlayer.playerId, 'rest', null);
      if(moved){
        debugLog('rest card move success', selectedPlayer.playerId + ' -> rest');
        setSelectedPlayer(null);
        showToast('已回到休息區');
        render();
      }else{
        debugLog('rest card move fail', selectedPlayer.playerId + ' -> rest');
        showToast('移動失敗');
      }
      return true;
    }
    return false;
  }

    tap('edgeTestBtn', () => {
      if(currentAutoCallMode() !== 'edge'){ showToast('Edge 尚未 Ready'); return; }
      callPlayers(restPlayerNamesForEdgeCheck().slice(0, 4), activeCourts()[0] || 'court1');
    });
    tap('saveVoiceBtn', saveVoiceSettings);
    ['voiceRateSelect','voicePitchSelect','zhVoiceSelect','enVoiceSelect','callEffectDurationSelect','callEffectIntensitySelect','callEffectColorSelect','callMarqueeSelect','courtEntryAnimationModuleSelect'].forEach(function(id){
      const el = $(id);
      if(el) el.addEventListener('change', saveVoiceSettingsSilently);
    });
    if($('playerNameScaleSelect')) $('playerNameScaleSelect').addEventListener('change', savePlayerNameDisplaySettings);
    if($('playerNameFontSelect')) $('playerNameFontSelect').addEventListener('change', savePlayerNameDisplaySettings);
    tap('addPlayerBtn', () => addPlayer($('newPlayerInput').value));
    $('newPlayerInput').addEventListener('keydown', e => { if(e.key==='Enter') addPlayer($('newPlayerInput').value); });
    tap('renamePlayerBtn', renameSelected);
    tap('deletePlayerBtn', deleteSelected);
    tap('plusGameBtn', () => adjustSelectedGames(1));
    tap('minusGameBtn', () => adjustSelectedGames(-1));
    tap('zeroPlayerBtn', zeroSelectedGames);
    tap('resetAllGamesBtn', resetAllGames);
    tap('resetTodayBtn', resetToday);
    tap('clearAllBtn', clearAll);
    tap('use3x3Btn', () => setCourtMode(3));
    tap('use2x2Btn', () => setCourtMode(2));
    tap('nextCountMinBtn', () => setNextCount(Number(dataAttr($('nextCountMinBtn'), 'next-count-value'))));
    tap('nextCountMidBtn', () => setNextCount(Number(dataAttr($('nextCountMidBtn'), 'next-count-value'))));
    tap('nextCountMaxBtn', () => setNextCount(Number(dataAttr($('nextCountMaxBtn'), 'next-count-value'))));
    tap('saveCourtLabelsBtn', saveCourtLabels);
    tap('exportBackupBtn', exportJson);
    tap('exportLogBtn', exportLogCsv);
    tap('importBackupBtn', showImportPasteDialog);
    $('importFileInput').addEventListener('change', function(e){ handleImportFile(e.target.files && e.target.files[0] ? e.target.files[0] : null); });
    setTap($('newPlayerColorGrid'), (e) => {
      const swatch = closestByClass(e.target, 'color-swatch');
      if(!swatch) return;
      const color = dataAttr(swatch, 'color') || COLORS[0];
      if(selectedPlayer && getPlayer(selectedPlayer.playerId)) setSelectedPlayerColor(color);
      else{
        selectedNewPlayerColor = color;
        renderColorPicker();
      }
    });
    setTap($('localVoiceList'), (e) => {
      if(!e.target || !e.target.getAttribute) return;
      const key = e.target.getAttribute('data-delete-voice-key');
      if(key) deleteLocalVoiceAsset(key);
    });
    const collapseButtons = document.querySelectorAll('[data-collapse-target]');
    for(let i = 0; i < collapseButtons.length; i += 1){
      const btn = collapseButtons[i];
      setTap(btn, () => {
        const target = dataAttr(btn, 'collapse-target');
        if(collapsedSections.has(target)) collapsedSections.delete(target);
        else collapsedSections.add(target);
        saveCollapsedSections();
        renderCollapsedSections();
      });
    }

    if(window.speechSynthesis){
      if(window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener('voiceschanged', populateVoiceSelects);
      window.speechSynthesis.onvoiceschanged = populateVoiceSelects;
    }

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { snapFloatingButton(); }, 150);
    });
  }

  function registerServiceWorker(){
    if('serviceWorker' in navigator){
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.warn);
      });
    }
  }

  function simplifyLabels(){
    if($('fetchRosterBtn')) $('fetchRosterBtn').textContent = '更新日安名單';
    if($('exportBackupBtn')) $('exportBackupBtn').textContent = '複製名單';
    if($('importBackupBtn')) $('importBackupBtn').textContent = '貼上名單';
    if($('resetTodayBtn')) $('resetTodayBtn').textContent = '今日重新開始';
  }

  function exposeDebugApi(){
    if(!DEBUG_MODE) return;
    window.__badmintonIpadV1 = {
      getState:function(){ return clone(state); },
      setState:function(nextState){
        state = normalizeState(nextState || {});
        setSelectedPlayer(null);
        saveState();
        render();
      },
      tap:function(id){
        const el = $(id);
        if(!el) throw new Error('missing element ' + id);
        const event = {
          type:'touchend',
          target:el,
          cancelable:true,
          preventDefault:function(){},
          stopPropagation:function(){}
        };
        el.dispatchEvent(event);
      },
      handleBoardInteraction:handleBoardInteraction,
      courtDown:courtDown,
      nextUp:nextUp,
      setCourtMode:setCourtMode,
      setNextCount:setNextCount,
      resetToday:resetToday,
      clearAll:clearAll,
      importPlayersFromText:importPlayersFromText,
      showTodayRosterEditor:showTodayRosterEditor,
      saveTodayRosterFromText:saveTodayRosterFromText,
      parseRosterEditorNames:parseRosterEditorNames,
      importRosterPlayers:importRosterPlayers,
      setSelectedPlayerColor:setSelectedPlayerColor,
      requestRosterApi:requestRosterApi,
      showRosterImportDialog:showRosterImportDialog,
      showRosterEventList:showRosterEventList,
      showRosterPreview:showRosterPreview,
      exportJson:exportJson,
      exportLogCsv:exportLogCsv,
      callPlayers:callPlayers,
      repeatLastCall:repeatLastCall,
      prepareFirstNextGroupCall:prepareFirstNextGroupCall,
      detectNameLanguage:detectNameLanguage,
      courtLabel:courtLabel,
      courtVoiceText:courtVoiceText,
      callSequenceParts:callSequenceParts,
      restPlayerNamesForEdgeCheck:restPlayerNamesForEdgeCheck,
      checkEdgeReadyFromRest:checkEdgeReadyFromRest,
      enableAutoCallWithEdgeCheck:enableAutoCallWithEdgeCheck,
      enableBrowserAutoCall:enableBrowserAutoCall,
      disableAutoCall:disableAutoCall,
      saveCourtLabels:saveCourtLabels,
      setAutoCallModeForTest:function(mode){ setAutoCallMode(mode); saveState(); renderPanel(); },
      voiceAssetDescriptor:voiceAssetDescriptor,
      requiredLocalVoiceAssets:requiredLocalVoiceAssets,
      requiredLocalVoiceAssetsForToday:requiredLocalVoiceAssetsForToday,
      localVoicePut:localVoicePut,
      localVoiceGet:localVoiceGet,
      localVoiceGetAll:localVoiceGetAll,
      localVoiceDelete:localVoiceDelete,
      localVoiceClear:localVoiceClear,
      localVoiceCheck:localVoiceCheck,
      refreshLocalVoiceStatus:refreshLocalVoiceStatus,
      generateMissingVoiceAssets:generateMissingVoiceAssets,
      edgeSpokenName:edgeSpokenName,
      autoArrangeCourtDown:autoArrangeCourtDown,
      autoNextUpToCourt:autoNextUpToCourt,
      markCourtCallTarget:markCourtCallTarget,
      courtEntryAnimationShouldRun:courtEntryAnimationShouldRun,
      prepareCourtEntryAnimation:prepareCourtEntryAnimation,
      render:render,
      populateVoiceSelects:populateVoiceSelects
    };
  }

  function init(){
    isAdmin = isAdminUnlocked();
    simplifyLabels();
    bindEvents();
    initPanelScrollGuard();
    initFloatingButton();
    populateVoiceSelects();
    render();
    exposeDebugApi();
    registerServiceWorker();
  }

  init();
})();
</script>
</body>
</html>
